name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 版本与 uv.lock 里 dev extra 解析出的 ruff 对齐；升级 ruff 时两处一起改。
      # 单独一个 job 是为了不排队等 Rust 编译，几十秒就能给出 lint 反馈。
      - name: ruff check
        # scripts 一并纳入：里面有 CI 工具（如 ci_shard.py），不 lint 就是门禁盲区。
        run: uvx ruff@0.16.7 check src tests scripts

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      # cargo test（--no-default-features，即非 extension-module）需要链接 libpython
      - name: Install libpython
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: cargo test
        working-directory: crates
        # --no-default-features 关闭 extension-module，让测试二进制链接 libpython
        run: cargo test --workspace --no-default-features

  python:
    name: Python (pytest ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # 矩阵分片：仓库是 public，Actions 分钟数免费 —— 把 5000+ 用例摊到多个 runner
    # 上并行跑，是唯一能大幅压墙钟的手段。为什么不干脆加大 xdist 的 worker 数：
    # runner 只有 2 核，`-n auto`=2 已是实测上限，超订会撞出并行 flaky（同一台机
    # 对照：-n 2 → 0 个 ERROR，-n 4 → 20 个 setup ERROR）。
    # 分片脚本保证「所有片的并集 == 全部测试文件」—— 漏跑一个文件会让 CI 少跑测试
    # 却照样报绿，所以这条不变量有专门单测盯着（tests/unit/test_ci_shard.py）。
    # 注意分片是按**文件**切的：跨文件的 xdist_group（如 ask_store 横跨
    # test_ask_api.py 与 test_ask_session_control.py）会被拆到不同 runner。当前
    # 这些组保护的资源都是 runner 本地的（如 data/ask.db），拆开反而更隔离；将来
    # 若出现「组内共享跨机资源」的用例，文件级分片就不适用了。
    strategy:
      fail-fast: false
      matrix:
        # 片数只有这一个真相源：下面的 SHARDS 直接由矩阵长度推导
        # （strategy.job-total）。曾经把 SHARDS 写死成 "3"，那与这里构成两处
        # 真相源 —— 矩阵加了片而 SHARDS 没跟上时，多出来的片号本该覆盖的文件
        # 就永远不会被任何 job 跑到，而 CI 依然全绿（实测：SHARDS 偏大时会静默
        # 漏掉约 25% 的测试文件）。改成推导后两者不可能脱节。
        # 片数**保持 3**：试过 5 片，单片确实更快（固定开销摊薄），但分组一变就
        # 频繁撞上本仓既有的偶发挂起 —— 实测 3 次运行里第 5 片挂了 2 次、第 2 片
        # 失败 1 次（挂起要等 20 分钟 timeout 才失败，代价极高）。3 片是长期稳定
        # 的配置，提速改从「砍单片固定开销」入手（见下面的 Rust 扩展缓存）。
        shard: [1, 2, 3]
        # Python 版本走矩阵而不是写死字符串：它同时被 setup-uv 和 Rust 扩展的
        # 缓存 key 引用（扩展用 pyo3 且**没开 abi3**，与 CPython 小版本强绑定），
        # 两处必须一致，否则会拿 3.12 的 .so 去 3.13 上跑。
        python: ["3.12"]
    env:
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      # Rust 扩展跨 run 复用：PR 绝大多数不动 crates/，命中时能跳过 rust-cache
      # 恢复（16s）+ maturin 编译（13s）—— 每片省约 29s。
      # key 只含真正决定产物的输入：crates 下的源码与全部 toml（含 workspace 级
      # Cargo.toml、.cargo/config.toml）、Cargo.lock、Python 版本、OS/arch。
      # **故意不含 uv.lock**：这几个 crate 只在编译期用 pyo3，运行期不碰 polars
      # （crates 里没有任何 polars 运行时调用），所以 Python 侧依赖升级不会让产物
      # 失效。真正的耦合是 pyo3↔CPython（未开 abi3），那由 Python 版本这一项覆盖。
      # 目录名不带点：actions/cache 对隐藏路径的处理不像 upload-artifact 那样有
      # 显式开关，用普通目录名避免「缓存下来却是空的」。
      # 末尾 v1 是「构建配方」版本：改了下面 maturin 的调用方式就 +1。
      - name: 复用已构建的 Rust 扩展
        id: rustext
        uses: actions/cache@v4
        with:
          path: rust-ext
          key: rust-ext-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-v1-${{ hashFiles('crates/**/*.rs', 'crates/**/*.toml', 'crates/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.rustext.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.rustext.outputs.cache-hit != 'true'
        with:
          workspaces: crates
          key: python-maturin

      - name: Install Python deps
        run: |
          uv venv --python ${{ matrix.python }} --clear .venv
          uv pip install --python .venv/bin/python -e ".[sources,factors,ml,server,dev,chan]"

      - name: Build Rust 扩展（验证 pyo3/polars ABI）
        run: |
          set -euo pipefail
          SITE=$(.venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")

          build() {
            uv pip install --python .venv/bin/python maturin
            source .venv/bin/activate
            for c in lq-ops lq-backtest lq-metrics; do
              (cd crates/$c && maturin develop)
            done
            # 先清空再写，且**三个 .so 全拷完才写 COMPLETE**：恢复时校验这个哨兵，
            # 免得「编译中途挂掉」留下的半截目录被当成有效缓存。
            rm -rf rust-ext && mkdir -p rust-ext
            for m in lq_ops lq_backtest lq_metrics; do
              # 产物落点不固定，别假定：普通安装是 site-packages/<m>.so，而
              # maturin 的 editable 安装会做成**包目录** site-packages/<m>/
              # （CI 实测：lq_ops.__file__ = .../site-packages/lq_ops/__init__.py，
              #  .so 在包里面）。所以用 find 找，再退一步去 crate 目录里找。
              # 统一存成 <模块名>.so —— editable 下原名可能带平台标签，统一命名
              # 后恢复时才能被 import 直接找到（.so 里的 PyInit 符号名才是关键）。
              src=$(find "$SITE" -name "*$m*.so" -type f -print -quit)
              if [ -z "$src" ]; then
                src=$(find crates -name "*$m*.so" -type f -print -quit)
              fi
              if [ -z "$src" ]; then
                echo "::error::找不到 $m 的 .so 产物"; exit 1
              fi
              cp "$src" "rust-ext/$m.so"
            done
            touch rust-ext/COMPLETE
          }
          loads() {
            .venv/bin/python -c "from lquant._rust.loader import has_rust; assert has_rust()"
          }

          if [ "${{ steps.rustext.outputs.cache-hit }}" = "true" ] && [ -f rust-ext/COMPLETE ]; then
            # 拷贝必须容错：万一缓存里没有 .so，不能让 set -e 在这里先炸掉 ——
            # 得让它落到下面的 loads 判定，再走重编译那条路。
            if ls rust-ext/*.so >/dev/null 2>&1; then
              cp rust-ext/*.so "$SITE"/
            fi
            if loads; then
              echo "复用缓存扩展：$(ls rust-ext)"
            else
              # 缓存命中却加载失败：条目本身坏了/过期了。就地重编译保证不假红，
              # 但**同 key 的缓存无法被覆盖** —— 不告警的话，之后每次运行都会静默
              # 重编译。要让缓存重新生效，需把 key 末尾的 v1 加一。
              echo "::warning::缓存的 Rust 扩展加载失败，已就地重编译；该 key 的缓存条目已失效，需把 key 末尾的 v1 加一才能恢复命中"
              build
            fi
          else
            build
          fi

      - name: ABI 冒烟（断言 Rust 扩展真实加载，而非 python-fallback）
        run: |
          .venv/bin/python -c "
          from lquant._rust.loader import status
          st = status()
          print(st)
          assert all(v == 'rust' for v in st.values()), 'Rust 扩展加载失败（ABI 错配？）: ' + repr(st)
          "

      - name: 准备数据环境（与 pre-push 钩子一致：建库 + 空湖时生成演示数据）
        # 钩子跑测试前会先自愈环境（建库、空湖生成演示数据），CI 一直没这一步 ——
        # 于是 CI 全部落在「无库 / 空湖」分支上，而本地从来不是。本地用干净
        # checkout（无数据）跑整套时直接 native 崩溃，加上这一步就正常跑完，
        # 所以先把环境对齐，再谈测试本身。
        run: |
          set -euo pipefail
          mkdir -p data/duckdb data/parquet data/cache
          if [ ! -f data/duckdb/lquant.duckdb ]; then
            .venv/bin/python scripts/init_db.py
          fi
          if [ -z "$(find -L data/parquet -name '*.parquet' -print -quit 2>/dev/null)" ]; then
            .venv/bin/python -c "from lquant.cli.main import cli; cli(['data','demo'], standalone_mode=False)" >/dev/null
          fi

      - name: Run pytest (shard ${{ matrix.shard }}/${{ env.SHARDS }})
        # timeout -s ABRT：卡住时用 SIGABRT 触发 faulthandler，把所有线程栈 dump
        # 进日志 —— 哪个用例卡住、卡在哪一行一眼可见，而不是白烧到 6 小时 job
        # 超时（这次就烧了 3 小时以上还没结束）。1200s 是全量耗时的数倍余量，
        # 分片后单片更短，这里只是兜底。
        # 单片只跑分给自己的文件（脚本输出直接展开成 pytest 参数）。
        # loadgroup 保证 xdist_group 用例同 worker 按序。
        env:
          PYTHONFAULTHANDLER: "1"
          # 覆盖率的 sys.monitoring 后端（Python 3.12+；3.14 起才是默认核，
          # 所以 3.12 上这行确实换掉了 C tracer）。C tracer 在本仓真实用例上把
          # 测试拖慢 ~80%（热路径微基准实测慢 2.5x），sysmon 只慢 ~1.15x ——
          # CI 的 pytest 步占整个 job 时长的 83%，这是最大的一处无损提速。
          # 抽样对比过两种核的 covered/statements/missing 完全一致
          # （1874/28990/27116）；sysmon 不可用时是 fail-loud（CoverageWarning
          # + 退回 ctrace），不会静默少算。
          # 前提：branch coverage 关闭且无 dynamic_context —— 这两者在 3.12 上
          # sysmon 不支持，届时只打一次警告并静默退回 ctrace（收益消失但不报错）。
          # 将来若加 --cov-branch，需重新评估本行。
          COVERAGE_CORE: sysmon
        # 显式声明 bash：下面把 `$FILES` 不加引号地展开成 pytest 参数，靠的是
        # bash 对未引用变量做词分割。zsh 不做这件事（会整串当成一个路径），
        # 别让这个行为依赖 runner 的默认 shell。
        shell: bash
        run: |
          # -vv：卡死时**必须能定位到用例**。已经发生过三次「跑到 97~99% 后无声
          # 卡住 30+ 分钟直到 job 超时」——`-q` 只打点，SIGABRT 的栈里又只有
          # 事件循环的 select（被挂起的协程帧不在栈上），于是每次都只能靠重跑
          # 撞运气。`-v` 会逐条打印 [gwN] 用例名，最后一个卡住 worker 的末条
          # 输出就是它的下一个用例。日志变长（~5k 行）是这笔买卖值得付的价。
          # 注意必须 -vv：addopts 里已有 -q，再给一个 -v 净verbosity 为 0，
          # 只会打「每个文件一行」——第一次加的时候就是这么白干的。
          # 分片：只跑分给自己的文件。--cov-fail-under=0 是刻意的 —— 单片的覆盖率
          # 必然远低于 95%，全局门禁挪到 coverage-gate job 用合并后的数据判定。
          # --cov-report= 关掉终端报告：单片的数字没有意义，打出来只会误导。
          FILES=$(.venv/bin/python scripts/ci_shard.py ${{ matrix.shard }} "$SHARDS")
          if [ -z "$FILES" ]; then
            echo "分片为空 —— 拒绝退化成「pytest 无参数跑全量」"; exit 1
          fi
          timeout -s ABRT 1200 .venv/bin/python -m pytest $FILES \
            -vv -n auto --dist loadgroup \
            --cov=src/lquant --cov-report= --cov-fail-under=0
          # 改成 `.coverage.<片号>`：coverage combine 认的就是这个名字。
          mv .coverage .coverage.shard${{ matrix.shard }}

      - name: 上传分片覆盖率数据
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          # .coverage.* 是隐藏文件，upload-artifact@v4 默认跳过，必须显式打开
          include-hidden-files: true
          path: .coverage.shard${{ matrix.shard }}
          retention-days: 1

  coverage-gate:
    name: Coverage gate（全局 95% + diff-cover）
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— diff-cover 要 `--compare-branch=origin/main`，浅克隆里
      # 没有 origin/main 这个 ref，git diff 会直接报 ambiguous argument。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 装依赖（与 python job 同一条安装命令）
        # 必须和分片用**完全相同的 extras 集合**：coverage 的数据文件带 schema
        # 版本号，门禁侧若比写入侧（分片）旧，`coverage combine` 会直接读不了。
        # `uv pip install` 不读 uv.lock，所以「版本一致」靠的是两边同一份
        # pyproject + 同一组 extras 走同一个解析 —— extras 少写了就可能解出不同版本。
        # 这里的 --python 3.12 也要跟 python job 的 matrix.python 保持一致：覆盖率
        # 数据文件里带解释器版本，跨版本合并同样会读不了。改版本时两处一起改。
        run: |
          uv venv --python 3.12 --clear .venv
          uv pip install --python .venv/bin/python -e ".[sources,factors,ml,server,dev,chan]"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: 合并分片覆盖率 + 全局 95% 门禁
        # 门禁语义与改动前一致：原来由 pytest-cov 在单次全量跑里按 pyproject 的
        # fail_under=95 判定，现在改在**合并后的全量数据**上判定。各分片跑的是
        # --cov-fail-under=0，所以这一步必须真的把门禁跑起来 —— 否则 95% 要求会
        # 静默消失（少跑测试却照样报绿，是分片改造最需要盯住的失败模式）。
        run: |
          # 先核对分片数据到齐。少一片就等于少跑一部分测试，而合并后的覆盖率
          # **未必**会跌破 95（丢的那些行可能已被别的用例覆盖过），所以不能只靠
          # 门禁兜底。这里校验片号是否连续 1..N。
          have=$(ls .coverage.shard* 2>/dev/null | sed 's/.*shard//' | sort -n | xargs)
          n=$(ls .coverage.shard* 2>/dev/null | wc -l | tr -d ' ')
          want=$(seq 1 "$n" | xargs)
          if [ -z "$have" ] || [ "$have" != "$want" ]; then
            echo "::error::分片覆盖率数据缺失或不连续：实际 [$have]，期望 [$want]"
            ls -la .coverage* || true
            exit 1
          fi
          echo "收到 $n 份分片数据：$have"
          .venv/bin/python -m coverage combine
          # --fail-under=0：pyproject 的 fail_under 会让 `coverage xml` 在不达标时
          # 直接非零退出，那样 diff-cover 就没输入了。先把 xml 稳稳落盘，门禁交给
          # 下一行显式判定（失败信息也更直白）。
          .venv/bin/python -m coverage xml -o coverage.xml --fail-under=0
          .venv/bin/python -m coverage report --fail-under=95

      - name: diff-cover（改动行覆盖率 ≥95%）
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          .venv/bin/python -m diff_cover.diff_cover_tool coverage.xml \
            --compare-branch=origin/main --fail-under=95

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Unit tests (vitest)
        run: npm run test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
