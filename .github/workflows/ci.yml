name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 版本与 uv.lock 里 dev extra 解析出的 ruff 对齐；升级 ruff 时两处一起改。
      # 单独一个 job 是为了不排队等 Rust 编译，几十秒就能给出 lint 反馈。
      - name: ruff check
        run: uvx ruff@0.16.7 check src tests

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      # cargo test（--no-default-features，即非 extension-module）需要链接 libpython
      - name: Install libpython
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: cargo test
        working-directory: crates
        # --no-default-features 关闭 extension-module，让测试二进制链接 libpython
        run: cargo test --workspace --no-default-features

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: python-maturin

      - name: Install Python deps
        run: |
          uv venv --python 3.12 --clear .venv
          uv pip install --python .venv/bin/python -e ".[sources,factors,ml,server,dev]"

      - name: Build Rust 扩展（验证 pyo3/polars ABI）
        run: |
          uv pip install --python .venv/bin/python maturin
          source .venv/bin/activate
          for c in lq-ops lq-backtest lq-metrics; do
            (cd crates/$c && maturin develop)
          done

      - name: ABI 冒烟（断言 Rust 扩展真实加载，而非 python-fallback）
        run: |
          .venv/bin/python -c "
          from lquant._rust.loader import status
          st = status()
          print(st)
          assert all(v == 'rust' for v in st.values()), 'Rust 扩展加载失败（ABI 错配？）: ' + repr(st)
          "

      - name: Run pytest
        run: .venv/bin/python -m pytest tests -m "not slow"

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Unit tests (vitest)
        run: npm run test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
