name: Secret scan

# 三道触发，各管一段：
#   push/PR      → 只扫「本次引入的提交」，几十秒出结果，是本地钩子被 --no-verify
#                  绕过后的服务端兜底；
#   schedule     → 全历史审计。历史不会变，但**规则集会变**（gitleaks 升级、
#                  .gitleaks.toml 加规则），当时干净的历史可能今天就有问题；
#   workflow_dispatch → 公开仓库前的体检，手动跑一次。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch:

# 只读就够：不推回任何东西，也不需要额外 token —— gitleaks 由本 workflow
# 自己按固定版本安装（见下），不依赖会消耗额度的第三方 action。
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地 `make secrets-install` 保持同一版本。升级时两处一起改，
  # 否则「本地过了 CI 挂」会重新出现。
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    name: 密钥扫描（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 范围扫描与全历史扫描都需要完整历史；默认的浅克隆拿不到父提交。
          fetch-depth: 0

      - name: 安装 gitleaks（固定版本 + 校验 checksum）
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL -o gl.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o sums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # 校验下载物：不校验的话，release 被投毒等于在 CI 里跑任意二进制
          grep 'linux_x64.tar.gz' sums.txt | sha256sum -c -
          tar -xzf gl.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 扫描本次改动
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          # 交给脚本自己写报告；CI 里脚本会自动关掉 -v（公开仓的 CI 日志是
          # 公开的，-v 的 Finding 行会带出密钥尾部片段），只输出「位置 + 规则」。
          LQ_SECRET_REPORT: ${{ runner.temp }}/gitleaks-report.json
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # 新分支的 push：before 是全零，没有可用的父提交，退回全历史
            echo "新分支 push，退回全历史扫描"
            scripts/secret_scan.sh history
          else
            scripts/secret_scan.sh range "$base..$head"
          fi

      - name: 全历史审计
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          LQ_SECRET_REPORT: ${{ runner.temp }}/gitleaks-report.json
        run: scripts/secret_scan.sh history

      - name: 卫生检查（内部文件 / 本机绝对路径）
        # 非严格模式：本机路径只告警不失败。要让它成为硬门禁，
        # 公开前用 `make public-ready`（LQ_HYGIENE_STRICT=1）。
        run: scripts/secret_scan.sh hygiene

      - name: 上传报告（失败时）
        # 报告里 Match/Secret 都是 REDACTED，只有 File/Line/RuleID，
        # 所以即使公开仓的 artifact 人人可下，也不会二次泄露密钥值。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 3
          if-no-files-found: ignore
