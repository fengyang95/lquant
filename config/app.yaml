env: ${LQ_ENV:dev}

paths:
  data_dir: ${LQ_DATA_DIR:./data}
  parquet: ${LQ_DATA_DIR:./data}/parquet
  duckdb: ${LQ_DUCKDB_PATH:./data/duckdb/lquant.duckdb}
  cache: ${LQ_DATA_DIR:./data}/cache

timezone: Asia/Shanghai

agent:
  # 「问 AI」= 问内置 Claude Code（默认）。codex 走同一套无头 CLI 骨架；
  # mock 是脚本化演示（不调 LLM），只用于无 CLI 的环境跑通链路。
  provider: ${LQ_AGENT_PROVIDER:claude_code}
  claude_path: ${LQ_CLAUDE_PATH:claude}
  codex_path: ${LQ_CODEX_PATH:codex}
  workspace_dir: ${LQ_AGENT_WORKSPACE:data/agent_workspace}
  timeout_seconds: ${LQ_AGENT_TIMEOUT:300}
  # 无头 CLI 必须跳过交互授权（等价于全自主权限，仅限本机单人使用）。
  # codex 侧还决定 MCP 工具能不能调：审批策略不 bypass 时会被直接拒绝。
  skip_permissions: ${LQ_AGENT_SKIP_PERMISSIONS:true}
  # 模型不在平台侧配置：两个 CLI 都复用自身的模型配置
  # （claude 的 ANTHROPIC_* / settings；codex 的 ~/.codex/config.toml），
  # 见 docs/AGENT_MODEL.md
  #
  # 新建会话的默认能力集（逗号分隔或 YAML 列表）。
  # all / 留空 = 全开；none = 一个都不启用（注意与工作区里的
  # LQ_MCP_ENABLED_TOOLS 不同 —— 那个的空串表示「一个都不开」）。
  # 「问 AI」页新建会话时按它预填，可逐会话覆盖（建后锁定）。
  default_skills: ${LQ_AGENT_DEFAULT_SKILLS:all}
  default_mcp_tools: ${LQ_AGENT_DEFAULT_MCP_TOOLS:all}

store:
  # 日频按年单文件，不要按 symbol 分文件（小文件灾难）
  daily_partition: year
  minute_partition: year_month
  compression: zstd
  # DuckDB 只允许单个写进程：所有写操作收敛到 writer 角色
  duckdb_write_role: writer

ingest:
  concurrency: ${LQ_INGEST_CONCURRENCY:4}
  watchdog_sec: ${LQ_INGEST_WATCHDOG_SEC:120}
  batch_size: 200
  checkpoint_every: 500

quality:
  fatal_on: [price_range, ohlc_consistency, unit_normalize]
  crosscheck_sample: 200
  index_sentinels: ["000001.SH", "000300.SH", "000905.SH", "000852.SH", "399006.SZ"]

logging:
  level: INFO
  file: ${LQ_DATA_DIR:./data}/logs/lquant.log
  rotation: "50 MB"
