# 越靠前优先级越高。每个 Provider 必须声明 capability，
# 路由层按需选源 —— Fallback 链解决不了「某源根本没有 1 分钟线」的问题。
providers:
  - name: baostock
    enabled: true
    module: lquant.data.providers.baostock
    cls: BaoStockProvider
    qps: 0            # 无速率限制
    capability: [daily, minute_5, minute_15, minute_30, minute_60, etf_daily,
                 etf_minute_60, etf_meta, index_daily, financial_pit, calendar,
                 reference, adj_factor]
    note: 免费免注册；批量请求会静默挂起，必须走 watchdog

  - name: akshare
    enabled: false
    module: lquant.data.providers.akshare
    cls: AkShareProvider
    qps: 3            # 东财系极易封 IP
    capability: [daily, minute_1, minute_5, minute_15, minute_30, minute_60,
                 adj_factor, reference, etf_daily]
    note: 覆盖最广但易封；已接入声明式映射机制（daily/minute/adj_factor/securities/ETF 日线），保持关闭由用户开启

  - name: tushare
    enabled: true
    module: lquant.data.providers.tushare
    cls: TushareProvider
    env_key: TUSHARE_TOKEN   # 环境变量缺失 → build_chain 跳过该源（warning，不抛错）
    qps: 1            # 按积分档位限流，默认最低档
    capability: [daily, minute_1, minute_5, minute_15, minute_30, minute_60,
                 adj_factor, financial_pit, reference, calendar, etf_daily]
    note: >-
      pro 接口需 token；stk_mins 需 2000 积分，不足时报权限错误转 SourceUnavailable 切源。
      基本面统一主源（2026-09-13 约定）：financial_pit 财务四表 + daily_basic 市值/估值；
      日线只做 crosscheck peer，不取值。

  - name: efinance
    enabled: false
    module: lquant.data.providers.efinance
    cls: EfinanceProvider
    qps: 3
    capability: [daily, minute_1, etf_daily, realtime]

  - name: hithink
    enabled: false
    module: lquant.data.providers.hithink
    cls: HiThinkProvider
    env_key: HITHINK_API_KEY
    qps: 5
    capability: [daily, adj_factor, financial_pit, corporate_action]
    note: 同花顺官方，无分钟线；权威基准源

  - name: mootdx
    enabled: true
    module: lquant.market.providers.mootdx
    cls: MootdxProvider
    qps: 0
    capability: [realtime, minute_1]
    note: 通达信 TCP，不封 IP；看板热通路首选

  - name: tencent
    enabled: true
    module: lquant.data.providers.tencent
    cls: TencentProvider
    qps: 5
    capability: [realtime, reference]
    note: T0 源，不封 IP；realtime 热通路 + 指数哨兵对拍

  - name: sina
    enabled: true
    module: lquant.data.providers.sina
    cls: SinaProvider
    qps: 5
    capability: [adj_factor]
    note: 复权因子源（hfq.js），端点无常量契约（实验性）

  - name: tickdb
    enabled: false   # 预留：未实现，勿启用
    module: lquant.data.providers.tickdb
    cls: TickdbProvider
    qps: 0
    capability: [tick]
    note: >-
      预留位。接入 = 两步：config/schema/<table>.yaml 加对应 sources.tickdb 映射节 +
      实现 lquant/data/providers/tickdb.py（继承 MappingProvider 的薄类，仅写 _fetch_raw）。
      _import_all 刻意不加载本模块（无实现文件，import 失败会被吞掉，明确不加避免噪音）。

crosscheck:
  enabled: true
  # 一个源为主，比对只用于标记与降级，绝不用于取值
  primary: baostock
  peers: [tushare]   # 日线 baostock × tushare 对拍（akshare 易封 IP，不再做 peer）
  tolerance_pct: 0.1
  # 不比：前复权价（基准日不同）、行业分类（体系不同）、ETF 份额（源太少）
  fields: [open, high, low, close, pre_close, volume]
