# 轻量冒烟工作流：Alpha158 + sklearn Ridge（文件路径模型，不依赖 libomp/OpenMP）。
# qlib 工作流：Alpha158 特征 + LightGBM 模型 + TopkDropout 组合回测
# 格式与 qlib 官方 qrun 的 workflow_config 一致（由 lq qlib workflow 驱动）。
# 数据由 `lq qlib export` 从 lquant 日线湖导出（默认 data/qlib）。
#
# 口径说明：
# - 基准是**真实指数** 000300.SH（qlib symbol SH000300），由 `lq qlib export`
#   从 DuckDB index_daily 一并导出；先跑 `lq data index --start 2016-01-01`。
#   index_daily 为空时导出 manifest 的 benchmark 为 null，此处也须置 null。
# - 价格为「前复权到最新」序列（$factor = adj_factor/adj_factor_latest），
#   收益率与真实一致，deal_price 用 $close 即可。
qlib_init:
    provider_uri: "data/qlib"
    region: cn

market: &market all
# 真实基准：沪深300（与主 workflow 同一口径，冒烟结果才可与主流程比较）
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-09-18
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label

label: &label ["Ref($close, -2) / Ref($close, -1) - 1"]

dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
        handler:
            class: Alpha158
            module_path: qlib.contrib.data.handler
            kwargs:
                <<: *data_handler_config
                label: *label
        segments:
            train: [2024-01-01, 2025-06-30]
            valid: [2025-07-01, 2025-12-31]
            test: [2026-01-01, 2026-09-18]

model:
    class: SmokeRidge
    module_path: src/lquant/qlib_io/smoke_model.py
    kwargs:
        alpha: 1.0

port_analysis: &port_analysis
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 3
    backtest:
        start_time: 2026-01-01
        # end 收到日历倒数第二个交易日：qlib 末步需要下一交易日定价
        end_time: 2026-09-17
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
            trade_unit: 100
