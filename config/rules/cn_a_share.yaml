# 撮合规则表 —— 引擎不含任何硬编码规则，换市场 = 加一个 YAML
market: CN
currency: CNY
timezone: Asia/Shanghai

default:
  commission:
    rate: 0.00025
    min: 5.0
    # 一个订单分多次成交，最低佣金只收一次
    per_order: true
  tax:
    side: sell
    # 印花税有生效区间，历史回测必须按区间取
    schedule:
      - { from: "2008-09-19", to: "2023-08-27", rate: 0.001 }
      - { from: "2023-08-28", to: "9999-12-31", rate: 0.0005 }
  transfer_fee:
    rate: 0.00001     # 沪深过户费（双向）
  price_limit:
    mode: by_board
    main: 0.10
    gem: 0.20         # 创业板 301/302/300
    star: 0.20        # 科创板 688
    bse: 0.30         # 北交所
    st: 0.05
  t_plus: 1
  lot_size: 100
  slippage: { mode: pct, value: 0.0002 }

etf:
  # ETF 免的是印花税和过户费，**不是佣金**。
  # 漏配佣金会让所有 ETF 策略回测成本为零，收益系统性虚高。
  commission:
    rate: 0.0001        # 万分之一，互联网券商常见档位
    min: 0.1            # ETF 最低佣金通常 0.1 元（股票是 5 元）
    per_order: true
  tax:
    side: sell
    schedule:
      - { from: "2000-01-01", to: "9999-12-31", rate: 0.0 }   # ETF 免征印花税
  transfer_fee:
    rate: 0.0           # ETF 无过户费
  price_limit:
    mode: by_track_index      # 取决于跟踪指数，不猜代码段
    main: 0.10                # 未传入跟踪指数限制时的兜底
  t_plus:
    # 注意：per-instrument 覆盖优先（sellable_after_days），这里只是默认值
    mode: by_fund_type
    qdii: 0
    commodity: 0       # 黄金 ETF
    bond: 0
    money: 0
    default: 1
  lot_size: 100

exceptions:
  # 新股上市首日 / 退市整理期 / ST 变更日：不套用涨跌停约束
  no_price_limit_on: [ipo_first_day, resume_first_day, st_change_day]
