# daily_bar 字段映射（唯一事实源：lquant.data.schema.SCHEMAS["daily_bar"]）
# baostock 日线 amount 单位已是元，直接透传（amount 与 schema 同名）；
# 停牌行保留：is_suspended / is_st 由 provider 侧从 tradestatus/isST 转出
# （"0"=停牌 的取反语义映射白名单表达不了），映射层按 schema 同名透传。
# total_mv：总市值（元）——目标态：baostock 不出总股本，恒 NULL，待 tushare daily_basic 增强或 security join 填充。
table: daily_bar
sources:
  baostock:
    rename:
      date: trade_date
      code: symbol
      preclose: pre_close
      turn: turnover_rate
      pctChg: pct_chg
      peTTM: pe_ttm
      pbMRQ: pb_mrq
      psTTM: ps_ttm
      pcfNcfTTM: pcf_ncf_ttm
    derive:
      # 流通市值 ≈ close×volume/(turn/100)；turn 已在 fetch 侧把 0/空 → null
      float_mv: {expr: "close * volume * 100 / turnover_rate", from: [close, volume, turnover_rate]}
    fill: {sec_type: stock, source: baostock, quality_flags: 0, adj_factor: 1.0}
    required: [symbol, trade_date, open, high, low, close, volume]

  akshare:
    # stock_zh_a_hist / fund_etf_hist_em：中文列直接 rename。量纲归一
    # （成交量 手 → ×100 股、成交额 元系数 1.0）在 provider _select_daily
    # 出帧处用 normalize.scale_unit 完成 —— yaml 不再 derive 单位换算。
    # akshare 日线无 preclose/turnover，留空（不为 required），保持 None。
    rename:
      股票代码: symbol
      日期: trade_date
      开盘: open
      收盘: close
      最高: high
      最低: low
      成交量: volume
      成交额: amount
    fill: {sec_type: stock, source: akshare, quality_flags: 0, adj_factor: 1.0}
    required: [symbol, trade_date, open, high, low, close, volume]

  tushare:
    # pro.daily / fund_daily：ts_code 直出；量纲归一（vol 手 → ×100 股、
    # amount 千元 → ×1000 元）在 provider fetch 侧用 normalize.scale_unit
    # 完成 —— yaml 不再 derive 单位换算；pre_close 直出。
    # 日期解析（trade_date YYYYMMDD → Date）在 provider _fetch_raw 做。
    rename:
      ts_code: symbol
      vol: volume
      pre_close: pre_close
    fill: {sec_type: stock, source: tushare, quality_flags: 0, adj_factor: 1.0}
    required: [symbol, trade_date, open, high, low, close, volume]
