# daily_bar 字段映射（唯一事实源：lquant.data.schema.SCHEMAS["daily_bar"]）
# baostock 日线 amount 单位是千元 → 元（derive ×100）；
# 停牌行过滤（tradestatus）与 isST 布尔转换在 provider 的 _fetch_raw 做
# （trade_status / is_st 不是 schema 列，映射层 fail-fast 不允许 rename 到它们）。
table: daily_bar
sources:
  baostock:
    rename:
      date: trade_date
      code: symbol
      preclose: pre_close
      turn: turnover_rate
    derive:
      amount: {expr: "amount * 100", from: [amount]}   # 千元 → 元
    fill: {sec_type: stock, source: baostock, quality_flags: 0, adj_factor: 1.0}
    required: [symbol, trade_date, open, high, low, close, volume]

  akshare:
    # stock_zh_a_hist / fund_etf_hist_em：amount 已是元直接 rename；
    # volume 是手 → ×100 换算成股。akshare 日线无 preclose/turnover，
    # 留空（不为 required），保持 None。
    rename:
      股票代码: symbol
      日期: trade_date
      开盘: open
      收盘: close
      最高: high
      最低: low
      成交量: volume
      成交额: amount
    derive:
      volume: {expr: "volume * 100", from: [volume]}   # 手 → 股
    fill: {sec_type: stock, source: akshare, quality_flags: 0, adj_factor: 1.0}
    required: [symbol, trade_date, open, high, low, close, volume]

  tushare:
    # pro.daily / fund_daily：ts_code 与内部格式一致直接 rename；
    # vol 是手 → ×100 股，amount 是千元 → ×1000 元；pre_close 直出。
    # 日期解析（trade_date YYYYMMDD → Date）在 provider _fetch_raw 做。
    rename:
      ts_code: symbol
      pre_close: pre_close
    derive:
      volume: {expr: "vol * 100", from: [vol]}        # 手 → 股
      amount: {expr: "amount * 1000", from: [amount]} # 千元 → 元
    fill: {sec_type: stock, source: tushare, quality_flags: 0, adj_factor: 1.0}
    required: [symbol, trade_date, open, high, low, close, volume]
