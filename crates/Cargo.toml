[workspace]
resolver = "2"
members = ["lq-ops", "lq-backtest", "lq-metrics"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# ⚠️ pyo3 / pyo3-polars / polars 三者 ABI 强绑定，必须统一升级。
# 版本错配要到运行时才炸，且报错看起来像编译器 bug。
[workspace.dependencies]
polars = { version = "0.49", features = ["lazy", "dtype-full"] }
pyo3 = { version = "0.24", features = ["extension-module"] }
pyo3-polars = { version = "0.23" }
serde = { version = "1", features = ["derive"] }
arrow = "54"
