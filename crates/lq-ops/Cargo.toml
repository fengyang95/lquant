[package]
name = "lq-ops"
version.workspace = true
edition.workspace = true

[lib]
name = "lq_ops"
crate-type = ["cdylib"]

[dependencies]
polars = { workspace = true }
# 引入仅为开启 polars-ops/object、mem-engine/stream python feature，
# 与 pyo3-polars derive 拉起的 polars-core/object 对齐（见 workspace Cargo.toml）
polars-ops = { workspace = true }
polars-mem-engine = { workspace = true }
polars-stream = { workspace = true }
pyo3 = { workspace = true }
pyo3-polars = { workspace = true }
serde = { workspace = true }

[features]
# 默认开启（供 maturin 构建扩展）；cargo test 需 --no-default-features，
# 否则测试二进制不链接 libpython（pyo3 extension-module 的标准坑）
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

# ⚠️ 版本必须与 Python 侧 polars 完全一致（见 workspace Cargo.toml 对照表）
