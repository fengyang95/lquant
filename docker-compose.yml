services:
  redis:
    image: redis:7-alpine
    container_name: lquant-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["./data/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选：查看队列
  redis-ui:
    image: redislabs/redisinsight:latest
    container_name: lquant-redis-ui
    ports: ["5540:5540"]
    depends_on: [redis]
    profiles: ["debug"]
