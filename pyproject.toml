[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lquant"
version = "0.1.0"
description = "A-share quant research platform: data / factors / backtest / dashboard"
requires-python = ">=3.12"
license = { text = "MIT" }

# 注意：polars / pyo3 / pyo3-polars 三者 ABI 强绑定，必须统一升级
# polars-py 1.44 ↔ polars-rs 0.55（对照表见 crates/Cargo.toml），升级需两边同步
dependencies = [
  "polars>=1.44,<1.45",
  "pyarrow>=18",
  "duckdb>=1.4",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.8",
  "loguru>=0.7",
  # 上限放宽到 9：mootdx 锁 tenacity<9，两边的 retry API 足够兼容
  "tenacity>=8.1",
  "baostock>=0.8.8",
  "pandas>=2.2",
  "aiosqlite>=0.22.1",
  "psutil>=5.9",
]

[project.optional-dependencies]
# 数据源（按需安装，主源只依赖 baostock）
sources = [
  "akshare>=1.16",
  "efinance>=0.5",
  "mootdx>=0.10",
]
# 因子 / 组合
factors = [
  "scipy>=1.14",
  "statsmodels>=0.14",
  "skfolio>=0.6",
]
# 机器学习选股
ml = [
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
]
# 服务层
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "rq>=2.0",
  "redis>=5.2",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  # mootdx 锁 httpx<0.26，dev 测试客户端跟随该上限
  "httpx>=0.25,<0.26",
  "hypothesis>=6.100",
]

[project.scripts]
lq = "lquant.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: 需要网络或大数据", "rust: 依赖 Rust 扩展",
    "integration: 集成测试（需要本机 Redis）"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
  "PLR0913", "PLR2004", "B008",
  # 与仓库既有模式冲突的 PL 规则（新版 ruff preview 行为），见 lint 债务清理
  "PLC0415",   # 函数级 import 是有意的惰性加载模式（CLI/服务启动提速）
  "PLR0912",   # 复杂度：存量分支数
  "PLR0915",   # 复杂度：存量语句数
  "PLR0911",   # 复杂度：return 数
  "PLR0917",   # 复杂度：位置参数数
  "PLW0603",   # 模块级单例（cache/get_settings 等有意为之）
  "PLW2901",   # 循环变量重绑定（解析器惯用）
  "PLC0207",   # maxsplit 风格
  "PLW1510",   # subprocess check 默认
  "PLR1714",   # 链式比较合并
  "PLW3301",   # 相似分支
  "PLW0127",   # 自赋值诊断（DSL 解析器边界用法）
  "PLW0108",   # lambda 包一层 def
  "E741",      # l/I 变量名（数学语境）
  "E701",      # 单行多语句（存量风格）
  "E501",      # 行长交给 ruff format 与人审，不作为硬门禁
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["src/lquant"]
